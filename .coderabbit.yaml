language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  path_instructions:
    - path: "hooks/register.test.tsx"
      instructions: "Fixtures use invented data only (ABC-123 keys, the acme owner, made-up repositories and people). Each behaviour change has a test named for the behaviour."
